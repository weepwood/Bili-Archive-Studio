name: Windows 客户端测试版
on:
  workflow_dispatch:
  push:
    tags:
      - "v0.4.0-test.*"
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: 准备内置 Node 运行时与图标
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path runtime | Out-Null
          Copy-Item (Get-Command node).Source runtime/node.exe
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/create-icon.ps1
          node --version
          node --test tests/*.test.js
      - name: 安装 Tauri 工具
        run: npm install --no-save @tauri-apps/cli@2
      - name: 生成客户端图标
        run: npx tauri icon icon.png
      - name: 构建 NSIS 安装包
        run: npx tauri build --bundles nsis
      - name: 上传 Windows 安装包
        uses: actions/upload-artifact@v4
        with:
          name: Bili-Archive-Studio-Windows-Test
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: 发布测试 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: src-tauri/target/release/bundle/nsis/*.exe
